<!doctype html>
<html lang="en" data-mode="simple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Akọwe</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/binder.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="topbar" role="banner">
  <button type="button" id="nav-toggle" class="nav-toggle" aria-controls="sidenav" aria-expanded="false">
    <span aria-hidden="true">&#9776;</span> Menu
  </button>
  <a class="brand" href="#/">Akọwe</a>
  <a class="tb-link tb-books" id="tb-books" href="#/"><span aria-hidden="true">&#128218;</span> My books</a>
  <div class="topbar-context" id="context-bar" aria-label="Current book"></div>
  <a class="tb-link tb-new" id="new-btn" href="#/start" title="Start a new book: write it with the AI step by step, or let the AI write the whole book"><span aria-hidden="true">&#10133;</span> New book</a>
  <button type="button" id="mab-btn" class="tb-btn mab-btn" aria-haspopup="dialog" aria-label="AI working" hidden>
    <span aria-hidden="true">&#9889;</span> <span class="tb-label">AI working</span>
  </button>
  <nav class="topbar-links" aria-label="Book pages" id="top-links"></nav>
  <button type="button" id="jump-btn" class="tb-btn jump-btn adv-only" aria-haspopup="dialog" aria-keyshortcuts="Control+K /" title="Jump to any step, set or page (Ctrl+K or /)">
    <span aria-hidden="true">&#128269;</span> <span class="tb-label">Jump</span><kbd class="tb-kbd">Ctrl K</kbd>
  </button>
  <div class="tb-menu adv-only" id="sets-menu">
    <button type="button" id="sets-btn" class="tb-btn sets-btn" aria-haspopup="true" aria-expanded="false" aria-controls="sets-pop">
      <span aria-hidden="true">&#129513;</span> Sets
    </button>
    <div id="sets-pop" class="tb-pop sets-pop" hidden></div>
  </div>
  <button type="button" id="health-btn" class="tb-btn health-btn adv-only" aria-haspopup="dialog" aria-label="Health" data-state="unknown" title="Health checks">
    <span class="hb-ico" aria-hidden="true">&#129293;</span> <span class="tb-label">Health</span>
  </button>
  <button type="button" id="wf-btn" class="tb-btn wf-btn adv-only" aria-controls="wf-drawer" aria-expanded="false" aria-label="Test workflow" title="Test each part of the book process with your real AI (in a separate test book)">
    <span aria-hidden="true">&#129514;</span> <span class="tb-label">Test workflow</span>
  </button>
  <div class="tb-menu" id="more-menu">
    <button type="button" id="more-btn" class="tb-btn" aria-haspopup="true" aria-expanded="false" aria-controls="more-pop">
      <span aria-hidden="true">&#8943;</span> More<span id="more-dot" class="more-dot" hidden></span>
    </button>
    <div id="more-pop" class="tb-pop more-pop" hidden>
      <div id="more-links" class="more-links"></div>
      <div class="more-adv adv-only" role="group" aria-labelledby="more-adv-h">
        <p class="more-h" id="more-adv-h">Advanced</p>
        <button type="button" id="bible-btn" class="bible-btn" aria-haspopup="dialog">
          <span aria-hidden="true">&#129489;</span> Character &amp; place maker
        </button>
        <button type="button" id="selftest-btn" class="selftest-btn" aria-haspopup="dialog">
          <span aria-hidden="true">&#129514;</span> Test everything<span id="selftest-btn-state" class="selftest-btn-state"></span>
        </button>
      </div>
    </div>
  </div>
  <!-- ⏳ the run progress strip (run-strip.js): book, step, time left against the start estimate, finish time -->
  <div id="run-strip" class="run-strip" role="status" aria-live="off" data-testid="run-strip" hidden></div>
  <section id="ai-activity" class="ai-activity" aria-labelledby="aia-h" data-testid="ai-activity" hidden>
    <h2 id="aia-h" class="aia-h">AI activity <span class="aia-sub">— what your AIs are doing right now</span></h2>
    <ul id="aia-rows" class="aia-rows"></ul>
  </section>
</header>
<div id="aia-live" class="visually-hidden" aria-live="polite" aria-atomic="true" data-testid="aia-live"></div>
<div class="shell">
  <nav id="sidenav" class="sidenav" aria-label="Book sections"></nav>
  <main id="main" tabindex="-1">
    <noscript><p class="notice">Akọwe needs JavaScript enabled in this browser.</p></noscript>
    <p class="state-loading">Loading workspace&hellip;</p>
  </main>
</div>
<div id="live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="selftest-dialog" class="selftest-dialog" aria-labelledby="selftest-title"></dialog>
<dialog id="bible-dialog" class="selftest-dialog bible-dialog" aria-labelledby="bible-title"></dialog>
<dialog id="set-dialog" class="set-panel" aria-labelledby="set-panel-title"></dialog>
<dialog id="make-dialog" class="selftest-dialog make-dialog" aria-labelledby="make-title"></dialog>
<dialog id="jump-dialog" class="jump-dialog" aria-labelledby="jump-title"></dialog>
<dialog id="mab-dialog" class="selftest-dialog mab-dialog" aria-labelledby="mab-title"></dialog>
<dialog id="health-dialog" class="selftest-dialog health-dialog" aria-labelledby="health-title"></dialog>
<aside id="ai-dock" class="ai-dock" aria-label="Fill with AI panels"></aside>
<aside id="wf-drawer" class="wf-drawer" aria-labelledby="wf-title" hidden></aside>
</body>
</html>
