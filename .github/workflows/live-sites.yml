name: Live check of outside sites

# Checks every outside website/file the app depends on (Ollama search page and
# installers, Hugging Face search/file lists, ComfyUI builds, video models, …)
# so a site that changed is caught before a user hits it. See
# desktop-app/scripts/live-check.js and "Live checks" in desktop-app/README.md.
# Deliberately NOT run on pull requests or pushes: it depends on other people's
# servers, not on our code.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-sites
  cancel-in-progress: false

jobs:
  live-check:
    name: Outside sites still work the way the app expects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # No npm install needed: the script only uses the app's plain-Node modules
      # (model-catalog, llm-setup, sd-installer, video-installer, …) and fetch.
      - name: Run live check
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/live-check.js --markdown "$RUNNER_TEMP/live-check.md" --json "$RUNNER_TEMP/live-check.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/live-check.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit $code

      - name: Open or update the "site changed" issue
        if: failure()
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ steps.check.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const title = 'Live check: an outside site changed';
            let table = '';
            try { table = fs.readFileSync(`${process.env.RUNNER_TEMP}/live-check.md`, 'utf8'); } catch (e) { table = '_The live check crashed before writing its table — see the run log._'; }
            const code = process.env.EXIT_CODE;
            const kind = code === '1'
              ? 'At least one outside site **CHANGED** — the app needs a fix.'
              : code === '2'
                ? 'Some outside sites were **UNREACHABLE** (may be temporary; it is checked again next week).'
                : `The live check failed (exit code ${code || '?'}).`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              kind, '',
              `Run: ${run}`, '',
              table, '',
              '_Posted by `.github/workflows/live-sites.yml` (desktop-app/scripts/live-check.js). Re-run it from the Actions tab after a fix; close this issue when it is green._',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Still failing on ${new Date().toISOString().slice(0, 10)}: ${kind}\n\n${run}` });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
              core.info(`Opened issue #${created.number}`);
            }
