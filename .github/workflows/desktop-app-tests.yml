name: Desktop app tests

on:
  push:
    branches: [main]
    paths:
      - "desktop-app/**"
      - "AutoInjector/extension/selectors.js"
      - ".github/workflows/desktop-app-tests.yml"
  pull_request:
    paths:
      - "desktop-app/**"
      - "AutoInjector/extension/selectors.js"
      - ".github/workflows/desktop-app-tests.yml"

# A newer push to the same branch/PR cancels the older run instead of queuing.
concurrency:
  group: desktop-app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Mocked + jsdom suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - run: npm test

  browser-test:
    name: Real-Chromium selector tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      # Playwright is deliberately not a devDependency (see README) so a
      # regular `npm install` never triggers this download for end users —
      # CI installs it explicitly, on a runner with real network access.
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  e2e-test:
    name: Real Electron GUI end-to-end (Playwright + xvfb)
    runs-on: ubuntu-latest
    # This job used to sit until GitHub's 6-hour limit (the app never fully
    # exited). The test now force-closes Electron; these limits are a backstop.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop-app/package-lock.json
      # `npm ci` runs electron's postinstall, which downloads the real Electron
      # binary the GUI test launches.
      - run: npm ci
      # Playwright drives the app via its Electron binary (not a browser), but
      # its install-deps step also pulls the shared system libraries Electron
      # itself needs on a headless Linux runner.
      - run: npm install --no-save playwright
      - run: npx playwright install-deps chromium
      - run: sudo apt-get install -y xvfb
      # A virtual display so Electron can render; the e2e test launches the real
      # app, clicks through it, and screenshots it. `timeout` + -k guarantee the
      # step ends even if something the app started refuses to quit.
      - run: timeout -k 30s 15m xvfb-run -a npm run test:e2e
        timeout-minutes: 16
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-screenshots
          path: desktop-app/test/e2e/__screenshots__/
          if-no-files-found: ignore
