name: Akọwe tests

on:
  push:
    branches: [main]
    paths:
      - "akowe/**"
      # tests/test_bridge_cross_process.py and test_failover_review.py drive the real Node bridge through this host
      - "desktop-app/akowe-bridge.js"
      - "desktop-app/akowe-legacy.js"
      - "desktop-app/test/fixtures/fake-bridge-host.js"
      - ".github/workflows/akowe-tests.yml"
  pull_request:
    paths:
      - "akowe/**"
      - "desktop-app/akowe-bridge.js"
      - "desktop-app/akowe-legacy.js"
      - "desktop-app/test/fixtures/fake-bridge-host.js"
      - ".github/workflows/akowe-tests.yml"

# A newer push to the same branch/PR cancels the older run instead of queuing.
concurrency:
  group: akowe-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (everything but the browser UI tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: akowe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            akowe/requirements.txt
            akowe/requirements-test.txt
      # Node runs the real AutoInjector bridge in the cross-process tests (skipped without it).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt -r requirements-test.txt
      # Playwright is not installed here, so tests/campaign/ui is skipped (its conftest ignores it); the job below
      # runs those. The AutoInjector desktop-app e2e skips too (it needs desktop-app/node_modules).
      - run: python -m pytest -q -p no:cacheprovider
        timeout-minutes: 25

  ui-test:
    name: Playwright UI campaign tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: akowe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            akowe/requirements.txt
            akowe/requirements-test.txt
      - run: python -m pip install -r requirements.txt -r requirements-test.txt playwright
      - run: python -m playwright install --with-deps chromium
      # The UI helpers launch Chromium from BF_CHROMIUM (default /opt/pw-browsers/chromium, the dev-container path)
      # and skip every UI test when it is missing, so point it at the browser Playwright just installed.
      - name: Point BF_CHROMIUM at the installed Chromium
        run: |
          exe=$(python -c "from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print(p.chromium.executable_path)")
          test -x "$exe"
          echo "BF_CHROMIUM=$exe" >> "$GITHUB_ENV"
      # pytest exits 5 if nothing is collected, so a silently skipped browser setup fails the job.
      - run: python -m pytest -q -p no:cacheprovider tests/campaign/ui
        timeout-minutes: 25
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: akowe-ui-screenshots
          path: shots/
          if-no-files-found: ignore
