<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>AutoInjector — Edit Prompt</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background:#111; color:#eee; font-size:12px; font-family: system-ui, sans-serif; padding:14px; display:flex; flex-direction:column; gap:10px; }
    label { display:block; font-size:10px; opacity:.6; text-transform:uppercase; letter-spacing:.03em; margin-bottom:3px; }
    input, textarea, button { background:#1a1a1a; color:#eee; border:1px solid #333; border-radius:6px; padding:5px 7px; font-family:inherit; font-size:12px; }
    button { cursor:pointer; }
    button:hover { background:#242424; }
    button.primary { background:#1a3a2a; border-color:#2a5a3a; }
    #name { width:100%; }
    .fill-all-row { display:flex; gap:6px; }
    #fill-all-text { flex:1 1 auto; min-width:0; }
    .field textarea { width:100%; height:110px; resize:vertical; }
    .fields { display:flex; flex-direction:column; gap:10px; flex:1 1 auto; min-height:0; overflow:auto; }
    .actions { display:flex; gap:8px; justify-content:flex-end; }
    #error { color:#e88; min-height:1em; }
  </style>
</head>
<body>
  <div>
    <label for="name">Prompt name</label>
    <input id="name" placeholder="e.g. Kickoff brief">
  </div>

  <div class="fill-all-row">
    <input id="fill-all-text" placeholder="Type once, then → All to copy it into every box below">
    <button id="btn-fill-all">→ All</button>
  </div>

  <div class="fields">
    <div class="field">
      <label>ChatGPT</label>
      <textarea id="text-chatgpt" placeholder="Leave blank to skip ChatGPT"></textarea>
    </div>
    <div class="field">
      <label>Claude</label>
      <textarea id="text-claude" placeholder="Leave blank to skip Claude"></textarea>
    </div>
    <div class="field">
      <label>Gemini</label>
      <textarea id="text-gemini" placeholder="Leave blank to skip Gemini"></textarea>
    </div>
  </div>

  <div id="error"></div>
  <div class="actions">
    <button id="btn-cancel">Cancel</button>
    <button id="btn-save" class="primary">Save</button>
  </div>
  <script src="prompt-editor.js"></script>
</body>
</html>
