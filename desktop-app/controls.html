<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>AutoInjector Desktop</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background:#111; color:#eee; font-size:12px; overflow:hidden; }
    #wrap { display:flex; flex-direction:column; gap:8px; padding:8px 10px; height:100vh; }
    #row-top { display:flex; gap:8px; flex:0 0 220px; min-height:0; }
    #row-bottom { display:flex; gap:8px; flex:1 1 auto; min-height:0; }
    .col { background:#171717; border:1px solid #2a2a2a; border-radius:8px; padding:7px 9px; overflow:auto; }
    .col h2 { font-size:11px; margin:0 0 5px; text-transform:uppercase; letter-spacing:.04em; opacity:.75; }
    #col-composer { flex: 0 0 220px; display:flex; flex-direction:column; }
    #col-composer textarea { flex:1; width:100%; resize:none; }
    #col-cards { flex:1 1 auto; display:flex; gap:8px; padding:0; background:transparent; border:none; overflow:auto; }
    #col-global { flex:0 0 190px; }
    #col-transcript { flex:1 1 auto; }
    #col-export { flex:0 0 150px; display:flex; flex-direction:column; gap:6px; }
    .site-card { flex:1 1 0; min-width:0; background:#171717; border:1px solid #2a2a2a; border-radius:8px; padding:7px 9px; display:flex; flex-direction:column; gap:5px; }
    .site-card.chatgpt { border-top:3px solid #10a37f; }
    .site-card.claude { border-top:3px solid #d97757; }
    .site-card.gemini { border-top:3px solid #4285f4; }
    .site-card-head { display:flex; align-items:center; gap:6px; font-weight:600; }
    .site-card-head button { margin-left:auto; padding:2px 6px; }
    .led { width:8px; height:8px; border-radius:50%; background:#444; flex:0 0 auto; }
    .preview { flex:1 1 auto; min-height:0; overflow:auto; background:#0e0e0e; border:1px solid #2a2a2a; border-radius:6px; padding:5px 6px; white-space:pre-wrap; line-height:1.3; opacity:.9; }
    .preview .ts { display:block; font-size:10px; opacity:.6; margin-bottom:3px; }
    .row-label { opacity:.65; font-size:10px; margin-right:3px; }
    select, input, textarea, button { background:#1a1a1a; color:#eee; border:1px solid #333; border-radius:6px; padding:4px 6px; font-family:inherit; font-size:11px; }
    button { cursor:pointer; }
    button:hover { background:#242424; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    button.auto-toggle.on { background:#1a3a2a; border-color:#2a5a3a; color:#8ef0b0; }
    .btns { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
    #status { margin-top:6px; opacity:.85; }
    .turn { border-left:3px solid #444; padding:4px 8px; margin-bottom:8px; background:#141414; border-radius:0 6px 6px 0; }
    .turn.chatgpt { border-color:#10a37f; }
    .turn.claude { border-color:#d97757; }
    .turn.gemini { border-color:#4285f4; }
    .turn .meta { font-size:10px; opacity:.65; margin-bottom:2px; }
    .turn .text { white-space:pre-wrap; line-height:1.35; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="row-top">
      <div id="col-composer" class="col">
        <h2>Compose</h2>
        <textarea id="composer-text" placeholder="Opening message to kick off the conversation…">What's the most underrated skill for engineers to learn in the next 5 years?</textarea>
        <div class="btns" id="composer-buttons" style="margin-top:6px;"></div>
      </div>

      <div id="col-cards"></div>

      <div id="col-global" class="col">
        <h2>Global</h2>
        <button id="btn-pause-all" style="width:100%;">Pause All Auto-Forward</button>
        <p style="opacity:.6; margin-top:8px;">"Auto → X" makes a pane forward every new reply to X automatically. Turning it on both directions between two AIs makes them talk forever until you pause.</p>
        <div id="status">Idle.</div>
      </div>
    </div>

    <div id="row-bottom">
      <div id="col-transcript" class="col">
        <h2>Transcript</h2>
        <div id="transcript"></div>
      </div>
      <div id="col-export" class="col">
        <h2>Export</h2>
        <button id="btn-copy">Copy Transcript</button>
        <button id="btn-download">Download .md</button>
        <button id="btn-clear">Clear</button>
      </div>
    </div>
  </div>
  <script src="controls.js"></script>
</body>
</html>
