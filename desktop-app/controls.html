<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>AutoInjector Desktop</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background:#111; color:#eee; font-size:12px; overflow:hidden; font-family: system-ui, sans-serif; display:flex; flex-direction:column; }

    #window-titlebar {
      flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
      height:38px; padding:0 10px; background:#181818; border-bottom:1px solid #2a2a2a;
      font-size:12px; font-weight:600;
    }
    #btn-collapse-window { font-size:13px; line-height:1; padding:3px 9px; }

    #wrap { display:flex; flex-direction:column; gap:8px; padding:8px 10px; flex:1 1 auto; min-height:0; overflow:auto; }
    #wrap.window-collapsed { display:none; }
    .col { background:#171717; border:1px solid #2a2a2a; border-radius:8px; padding:7px 9px; overflow:auto; }
    .col h2 { font-size:11px; margin:0 0 5px; text-transform:uppercase; letter-spacing:.04em; opacity:.75; }

    #topbar { display:flex; gap:8px; flex:0 0 auto; }
    #col-composer { flex: 1 1 240px; max-width:300px; display:flex; flex-direction:column; }
    #col-composer textarea { width:100%; height:56px; resize:none; }
    #col-participants { flex: 0 0 130px; }
    #col-global { flex: 0 0 210px; }
    #col-houserules { flex: 1 1 260px; }
    .participant-row { display:flex; align-items:center; gap:6px; margin:4px 0; }
    .role-badge { font-size:9px; padding:1px 5px; border-radius:4px; background:#2a2440; color:#c9b8ff; letter-spacing:.03em; }
    .role-badge:empty { display:none; }

    /* ---- merged AI columns: control strip + a native-view slot, stacked ---- */
    #ai-row { display:flex; gap:8px; flex:1 1 auto; min-height:0; }
    .ai-col {
      flex:1 1 0; min-width:0; display:flex; flex-direction:column;
      background:#171717; border:1px solid #2a2a2a; border-radius:8px; overflow:hidden;
      position:relative; transition: box-shadow .25s ease;
    }
    .ai-col.chatgpt { border-top:3px solid #10a37f; }
    .ai-col.claude { border-top:3px solid #d97757; }
    .ai-col.gemini { border-top:3px solid #4285f4; }
    .ai-col.disabled .control-strip { opacity:.5; }
    .ai-col.just-received { box-shadow: 0 0 0 2px #7c5ce0, 0 0 16px 2px rgba(124,92,224,.45); }

    .ai-col.collapsed { flex:0 0 40px; min-width:40px; }
    .ai-col.collapsed .preview,
    .ai-col.collapsed .btns,
    .ai-col.collapsed .pane-slot { display:none; }
    .ai-col.collapsed .control-strip { height:100%; }
    .ai-col.collapsed .card-head {
      writing-mode: vertical-rl; text-orientation: mixed; height:100%;
      margin-bottom:0; padding:8px 0; justify-content:flex-start; gap:8px;
    }
    .ai-col.collapsed .card-head .inspect-btn,
    .ai-col.collapsed .card-head .reload-btn { display:none; }

    .control-strip { padding:7px 9px; flex:0 0 auto; }
    .card-head { display:flex; align-items:center; gap:6px; font-weight:600; margin-bottom:6px; }
    .collapse-btn { background:none; border:none; padding:0 2px; font-size:12px; opacity:.55; cursor:pointer; }
    .collapse-btn:hover { opacity:1; }
    .led { width:8px; height:8px; border-radius:50%; background:#444; flex:0 0 auto; }
    .gendot { width:7px; height:7px; border-radius:50%; background:#333; flex:0 0 auto; }
    .gendot.on { background:#f5b642; animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.4; } 50% { opacity:1; } }
    .spacer { flex:1; }

    .preview { height:60px; overflow:auto; background:#0e0e0e; border:1px solid #2a2a2a; border-radius:6px; padding:5px 6px; white-space:pre-wrap; line-height:1.3; opacity:.9; }
    .preview .ts { display:block; font-size:10px; opacity:.6; margin-bottom:3px; }
    .row-label { opacity:.65; font-size:10px; margin-right:3px; }

    .pane-slot { flex:1 1 auto; min-height:140px; background:#0b0b0b; border-top:1px solid #2a2a2a; }
    .ai-col.disabled .pane-slot { flex:0 0 0; min-height:0; }

    #main-row { display:flex; gap:8px; flex:0 0 220px; min-height:0; }
    #col-transcript { flex:2 1 0; min-width:0; }
    #col-log { flex:1 1 0; min-width:0; }
    #activity-log { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:10.5px; line-height:1.5; }
    .log-line { opacity:.85; }
    .log-line.err { color:#e88; }
    .log-line .t { opacity:.55; margin-right:4px; }

    #exportbar { display:flex; gap:8px; align-items:center; flex:0 0 auto; }

    select, input, textarea, button { background:#1a1a1a; color:#eee; border:1px solid #333; border-radius:6px; padding:4px 6px; font-family:inherit; font-size:11px; }
    button { cursor:pointer; }
    button:hover { background:#242424; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    button:focus-visible { outline:2px solid #7c5ce0; outline-offset:1px; }
    button.auto-toggle.on { background:#1a3a2a; border-color:#2a5a3a; color:#8ef0b0; }
    button.primary { background:#1a3a2a; border-color:#2a5a3a; }
    button.danger { background:#3a1a1a; border-color:#5a2a2a; }
    .btns { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
    #status, #mesh-status { opacity:.85; }
    #char-count { font-size:9.5px; opacity:.6; text-align:right; margin-top:2px; }
    #char-count.warn { color:#f0ac52; opacity:1; }

    .turn { border-left:3px solid #444; padding:4px 8px; margin-bottom:8px; background:#141414; border-radius:0 6px 6px 0; position:relative; }
    .turn.chatgpt { border-color:#10a37f; }
    .turn.claude { border-color:#d97757; }
    .turn.gemini { border-color:#4285f4; }
    .turn .meta { font-size:10px; opacity:.65; margin-bottom:2px; display:flex; align-items:center; gap:5px; }
    .turn .text { white-space:pre-wrap; line-height:1.35; }
    .pin-btn { background:none; border:none; padding:0 2px; font-size:11px; opacity:.4; cursor:pointer; }
    .pin-btn:hover { opacity:.9; }
    .pin-btn.pinned { opacity:1; }
    .turn.pinned { border-left-width:4px; background:#191614; }
    .turn.verdict, .turn.final-plan { border-left-color:#f5b642 !important; background:#1d1608; }
    .badge-verdict { color:#f5b642; }
    .badge-final-plan { color:#8ef0b0; }
    .badge-roundtable { color:#7fd4e0; font-weight:600; }
  </style>
</head>
<body>
  <div id="window-titlebar">
    <span>AutoInjector Desktop — Automation</span>
    <button id="btn-collapse-window" title="Collapse this window to a titlebar">⌄</button>
  </div>
  <div id="wrap">
    <div id="topbar">
      <div id="col-composer" class="col">
        <h2>Compose</h2>
        <textarea id="composer-text" placeholder="Type a message to kick off or interject…">What's the most underrated skill for engineers to learn in the next 5 years?</textarea>
        <div id="char-count">0 chars</div>
        <div class="btns" id="composer-buttons" style="margin-top:4px;"></div>
      </div>

      <div id="col-participants" class="col">
        <h2>Participants</h2>
        <div class="participant-row"><label><input type="checkbox" id="p-chatgpt" checked> ChatGPT</label></div>
        <div class="participant-row"><label><input type="checkbox" id="p-claude" checked> Claude</label></div>
        <div class="participant-row"><label><input type="checkbox" id="p-gemini" checked> Gemini</label></div>
      </div>

      <div id="col-global" class="col">
        <h2>Global</h2>
        <div class="btns">
          <button id="btn-auto-all" class="primary">Auto (checked participants)</button>
          <button id="btn-pause-all">Pause</button>
          <button id="btn-stop-all" class="danger">Stop</button>
        </div>
        <div id="mesh-status" style="margin-top:6px;">Auto is off.</div>
        <div id="status">Idle.</div>
      </div>

      <div id="col-houserules" class="col">
        <h2>House Rules</h2>
        <p style="opacity:.6; margin:0 0 6px;">Structures the conversation for you — uses the Compose text above as the topic/goal.</p>
        <select id="hr-mode" style="width:100%;">
          <option value="">— pick a format —</option>
          <option value="who-wants-to-speak">Who Wants to Speak?</option>
          <option value="debate">Debate</option>
          <option value="free-for-all">Free-for-All</option>
          <option value="devil-angel">Devil &amp; Angel (needs 3)</option>
          <option value="chargeback">Chargeback (needs 3 + rounds)</option>
          <option value="brainstorm">Brainstorm</option>
          <option value="rotation">Rotation (needs 3 — legacy, see Conversation window)</option>
          <option value="roundtable">Roundtable v2 (needs 3 — tag-routed, see Conversation window)</option>
        </select>
        <div class="btns" style="margin-top:5px;">
          <input id="hr-rounds" type="number" min="0" placeholder="Rounds (0=∞)" style="width:110px;">
          <button id="btn-hr-start" class="primary">Start</button>
          <button id="btn-hr-stop" class="danger">Stop</button>
          <button id="btn-hr-wrapup" style="display:none;">Wrap Up</button>
        </div>
        <div id="hr-status" style="margin-top:6px;"></div>
      </div>
    </div>

    <div id="ai-row"></div>

    <div id="main-row">
      <div id="col-transcript" class="col">
        <h2>Transcript</h2>
        <div id="transcript"></div>
      </div>
      <div id="col-log" class="col">
        <h2>Activity / Troubleshooting</h2>
        <div id="activity-log"></div>
      </div>
    </div>

    <div id="exportbar" class="col">
      <button id="btn-copy">Copy Transcript</button>
      <button id="btn-download">Download .md</button>
      <button id="btn-clear">Clear Transcript</button>
    </div>
  </div>
  <script src="controls.js"></script>
</body>
</html>
