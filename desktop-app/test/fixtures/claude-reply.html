<!doctype html>
<html>
<head><meta charset="utf-8"/><title>Claude DOM fixture</title></head>
<body>
  <!-- Reconstructed from a live DevTools "Copy outerHTML" capture on claude.ai
       (2026-07) — see selectors.js's comment on the Claude ASSISTANT_CANDIDATES
       fix for context. Real Claude wraps a user turn as plain text (no markdown
       class) and an assistant turn inside a div.standard-markdown container. -->
  <div data-testid="user-message">test</div>

  <div class="row-start-1 col-start-1 relative z-[2] min-w-0">
    <div style="">
      <div>
        <div class="standard-markdown grid-cols-1 grid [&_>_*]:min-w-0 gap-3 standard-markdown">
          <p class="font-claude-response-body break-words whitespace-normal">Hey! I'm here and working. What can I help you with?</p>
        </div>
      </div>
    </div>
  </div>
  <div data-message-action-bar class="flex justify-start ml-0.5"></div>

  <div contenteditable="true" class="ProseMirror" data-placeholder="Reply to Claude..."></div>
  <button aria-label="Send Message">Send</button>
</body>
</html>
