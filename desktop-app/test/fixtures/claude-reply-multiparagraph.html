<!doctype html>
<html>
<head><meta charset="utf-8"/><title>Claude DOM fixture (multi-paragraph)</title></head>
<body>
  <!-- Same real structure as claude-reply.html, but with a second paragraph in
       the SAME standard-markdown container — proves the fix reads the whole
       container's text, not just the last <p class="font-claude-response-body">
       (which alone would truncate any multi-paragraph reply to its last block). -->
  <div class="row-start-1 col-start-1 relative z-[2] min-w-0">
    <div style="">
      <div>
        <div class="standard-markdown grid-cols-1 grid [&_>_*]:min-w-0 gap-3 standard-markdown">
          <p class="font-claude-response-body break-words whitespace-normal">First paragraph of the reply.</p>
          <p class="font-claude-response-body break-words whitespace-normal">Second paragraph, which must not be dropped.</p>
        </div>
      </div>
    </div>
  </div>
  <div data-message-action-bar class="flex justify-start ml-0.5"></div>
</body>
</html>
